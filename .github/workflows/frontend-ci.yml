name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/resume-app/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/resume-app/**"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resume-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/resume-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
